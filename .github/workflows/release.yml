name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Check tag matches package version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install musl toolchain
        run: sudo -n apt-get update && sudo -n apt-get install -y musl-tools
      - name: Build and package
        env:
          CARGO_BUILD_JOBS: '4'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          version=${GITHUB_REF_NAME#v}
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-musl/release/gray-subagents stage/gray-subagents
          chmod 755 stage/gray-subagents
          tar --owner=0 --group=0 --numeric-owner --mtime=@0 --sort=name \
            -cf - -C stage gray-subagents | gzip -n -9 > dist/gray-subagents-${version}.tar.gz
          cd dist && shasum -a 256 gray-subagents-${version}.tar.gz > gray-subagents-${version}.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
