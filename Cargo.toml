[package]
name = "gray-subagents"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Subagent plugin for Gray"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

tempfile = "3"
