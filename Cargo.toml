[package]
name = "gray-subagents"
version = "0.5.5"
edition = "2024"
license = "MIT"
description = "Subagent plugin for Gray"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
